[project]
name = "open-webui-zen-billing"
version = "0.1.0"
description = "Versioned Open WebUI functions for per-user OpenCode Zen cost accounting"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiohttp>=3.11,<4",
  "pydantic>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "requests>=2.32,<3",
]

[dependency-groups]
dev = ["aiosqlite>=0.20,<1", "ruff>=0.9,<1", "pyyaml>=6,<7"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "single"
